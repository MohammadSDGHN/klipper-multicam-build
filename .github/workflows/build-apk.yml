name: Build Klipper MultiCam APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout build wrapper
        uses: actions/checkout@v5

      - name: Checkout AndroidUVC source
        uses: actions/checkout@v5
        with:
          repository: FreeTracker/AndroidUVC
          ref: main
          path: AndroidUVC

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Show preinstalled Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          test -d "$ANDROID_HOME"
          ls -la "$ANDROID_HOME"
          echo "Installed NDKs:"
          ls -1 "$ANDROID_HOME/ndk" 2>/dev/null || true
          echo "Installed CMake:"
          ls -1 "$ANDROID_HOME/cmake" 2>/dev/null || true

      - name: Apply Klipper MultiCam patch
        run: python3 patch_androiduvc.py AndroidUVC

      - name: Allow Gradle to use/download SDK components if required
        shell: bash
        run: |
          echo "android.builder.sdkDownload=true" >> AndroidUVC/gradle.properties
          chmod +x AndroidUVC/gradlew

      - name: Build APK
        working-directory: AndroidUVC
        shell: bash
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Collect APK
        shell: bash
        run: |
          APK="$(find AndroidUVC/app/build/outputs/apk -type f -name '*.apk' | head -n 1)"
          test -n "$APK"
          cp "$APK" KlipperMultiCam.apk
          ls -lh KlipperMultiCam.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KlipperMultiCam-APK
          path: KlipperMultiCam.apk
          if-no-files-found: error
