name: Build Klipper MultiCam APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    steps:
      - name: Checkout build wrapper
        uses: actions/checkout@v5

      - name: Checkout AndroidUVC source
        uses: actions/checkout@v5
        with:
          repository: FreeTracker/AndroidUVC
          ref: main
          path: AndroidUVC

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Show preinstalled Android SDK
        shell: bash
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          test -d "$ANDROID_HOME"
          echo "Installed platforms:"
          ls -1 "$ANDROID_HOME/platforms" 2>/dev/null || true
          echo "Installed build-tools:"
          ls -1 "$ANDROID_HOME/build-tools" 2>/dev/null || true
          echo "Installed NDKs:"
          ls -1 "$ANDROID_HOME/ndk" 2>/dev/null || true
          echo "Installed CMake:"
          ls -1 "$ANDROID_HOME/cmake" 2>/dev/null || true

      - name: Apply Klipper MultiCam patch
        run: python3 patch_androiduvc.py AndroidUVC

      - name: Enable Gradle SDK auto-download safely
        shell: bash
        run: |
          printf '\nandroid.builder.sdkDownload=true\n' >> AndroidUVC/gradle.properties
          tail -n 5 AndroidUVC/gradle.properties
          chmod +x AndroidUVC/gradlew

      - name: Build APK
        working-directory: AndroidUVC
        shell: bash
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon

      - name: Select an ARM64-compatible APK
        shell: bash
        run: |
          set -euo pipefail

          echo "All APKs produced:"
          find AndroidUVC/app/build/outputs/apk -type f -name '*.apk' -print | sort || true
          echo

          show_abis() {
            local apk="$1"
            echo "---- $apk ----"
            unzip -l "$apk" | awk '/ lib\// {print $4}' | cut -d/ -f2 | sort -u || true
          }

          ARM_APK=""
          while IFS= read -r apk; do
            show_abis "$apk"
            if unzip -l "$apk" | grep -q 'lib/arm64-v8a/'; then
              ARM_APK="$apk"
              break
            fi
          done < <(find AndroidUVC/app/build/outputs/apk -type f -name '*.apk' | sort)

          if [ -z "$ARM_APK" ]; then
            echo
            echo "No ARM64 APK found in the normal build."
            echo "Retrying an ARM64-targeted Gradle build..."
            (
              cd AndroidUVC
              ./gradlew :app:assembleDebug                 -Pandroid.injected.build.abi=arm64-v8a                 --stacktrace --no-daemon
            )

            while IFS= read -r apk; do
              show_abis "$apk"
              if unzip -l "$apk" | grep -q 'lib/arm64-v8a/'; then
                ARM_APK="$apk"
                break
              fi
            done < <(find AndroidUVC/app/build/outputs/apk -type f -name '*.apk' | sort)
          fi

          if [ -z "$ARM_APK" ]; then
            echo
            echo "ERROR: build completed but no APK contains lib/arm64-v8a/."
            echo "The S10 SM-G973F requires an ARM ABI for native libraries."
            exit 1
          fi

          echo
          echo "Selected ARM64 APK: $ARM_APK"
          unzip -l "$ARM_APK" | awk '/ lib\// {print $4}' | head -n 80
          cp "$ARM_APK" KlipperMultiCam.apk
          ls -lh KlipperMultiCam.apk

      - name: Upload ARM64 APK
        uses: actions/upload-artifact@v4
        with:
          name: KlipperMultiCam-ARM64-APK
          path: KlipperMultiCam.apk
          if-no-files-found: error
